version: '3'

services:

  backstage:
    env_file:
      - .env
    build: .
    environment:
      NODE_OPTIONS: --no-node-snapshot
      POSTGRES_HOST: localhost
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKEND_SECRET: ${BACKEND_SECRET}
      APP_CONFIG_app_baseUrl: http://localhost:7008
      APP_CONFIG_backend_baseUrl: http://localhost:7007
      APP_CONFIG_backend_cors_origin: '["http://localhost:7008","http://127.0.0.1:7008"]'
      HOST: 0.0.0.0
    # ports:
    #   - 7007:7007
    #   - 7008:7008
    volumes:
      - ./backstage:/app
      - ./app-config.yaml:/app/app-config.yaml:ro
      - ./catalog-info.yaml:/app/catalog-info.yaml:ro
      - ./lerna.json:/app/lerna.json:ro
    network_mode: host
  

  postgres:
    image: postgres:12
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - backstage_pgdata:/var/lib/postgresql/data
    network_mode: host

volumes:
  backstage_pgdata:
